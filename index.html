<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Days Until</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-mood="dusk">

  <!-- Background layers -->
  <div id="bg">
    <div id="bg-gradient"></div>

    </svg>

    <svg id="cityscape" viewBox="0 0 1440 160" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">

L1309,45 L1309,62 L1316,62 L1316,80 L1326,80 L1326,98 L1336,98 L1336,115 L1346,115 L1346,130 L1380,130 L1380,118 L1390,118 L1390,105 L1400,105 L1400,90 L1410,90 L1410,105 L1420,105 L1420,118 L1440,118 L1440,160 Z"/>
    </svg>
  </div>

  <!-- App content -->
  <div id="app">

    <!-- Mode tabs -->
    <div id="mode-tabs">
      <button class="mode-tab active" data-mode="year">Year</button>
      <button class="mode-tab" data-mode="event">Custom Event</button>
    </div>

    <!-- Year panel -->
    <div id="panel-year" class="panel">
      <div class="select-wrapper">
        <select id="year-dropdown" aria-label="Select a year"></select>
        <span class="select-arrow">&#8964;</span>
      </div>
    </div>

    <!-- Custom event panel -->
    <div id="panel-event" class="panel hidden">
      <div id="event-form">
        <div class="form-row two-col">
          <div class="select-wrapper">
            <select id="event-type" aria-label="Event type">
              <option value="Birthday">🎂 Birthday</option>
              <option value="Anniversary">💍 Anniversary</option>
              <option value="Wedding">💒 Wedding</option>
              <option value="Baby Shower">👶 Baby Shower</option>
              <option value="Party">🎉 Party</option>
              <option value="Graduation">🎓 Graduation</option>
              <option value="Vacation">✈️ Vacation</option>
              <option value="Moving Day">🏠 Moving Day</option>
              <option value="New Job">💼 New Job</option>
              <option value="Holiday">🎄 Holiday</option>
              <option value="Concert">🎵 Concert</option>
              <option value="Reunion">🤝 Reunion</option>
              <option value="Retirement">🌴 Retirement</option>
              <option value="New Year">🥂 New Year</option>
              <option value="Valentine's Day">💕 Valentine's Day</option>
              <option value="Other">📅 Other</option>
            </select>
            <span class="select-arrow">&#8964;</span>
          </div>
          <div class="input-wrapper">
            <input type="date" id="event-date" aria-label="Event date">
          </div>
        </div>
        <div class="form-row">
          <input type="text" id="event-name" placeholder="Name your event (e.g. Sarah's Birthday)" maxlength="50" aria-label="Event name">
        </div>
        <button id="set-event-btn">Start Countdown</button>
      </div>
    </div>

    <!-- Countdown heading -->
    <header id="countdown-header">
      <p id="header-label">days until</p>
      <h1 id="display-target">2027</h1>
    </header>

    <!-- Days / Weeks toggle -->
    <div id="display-toggle">
      <button class="disp-btn active" data-disp="days">Days</button>
      <button class="disp-btn" data-disp="weeks">Weeks</button>
    </div>

    <!-- Countdown display -->
    <section id="time-display">
      <div id="countdown">
        <div class="time-unit" id="tile-weeks">
          <span class="number" id="val-weeks">00</span>
          <span class="label">weeks</span>
        </div>
        <div class="time-unit">
          <span class="number" id="val-days">00</span>
          <span class="label">days</span>
        </div>
        <div class="time-unit">
          <span class="number" id="val-hours">00</span>
          <span class="label">hours</span>
        </div>
        <div class="time-unit">
          <span class="number" id="val-minutes">00</span>
          <span class="label">minutes</span>
        </div>
        <div class="time-unit">
          <span class="number" id="val-seconds">00</span>
          <span class="label">seconds</span>
        </div>
      </div>

      <div id="time-ago" class="hidden">
        <p id="time-ago-text"></p>
      </div>
    </section>

    <!-- Google Calendar -->
    <button id="gcal-btn" class="hidden">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      Add to Google Calendar
    </button>

    <!-- Mood picker -->
    <div id="mood-picker">
      <span class="mood-label">Mood</span>
      <div class="mood-swatches">
        <button class="mood-swatch active" data-mood="dusk"   title="Dusk City"   style="background:linear-gradient(135deg,#4a2860,#c87880,#d49070)"></button>
        <button class="mood-swatch"        data-mood="night"  title="Night City"  style="background:linear-gradient(135deg,#010108,#06102e,#1a1a45)"></button>
        <button class="mood-swatch"        data-mood="golden" title="Golden Hour" style="background:linear-gradient(135deg,#4a1a06,#c04a18,#f0b840)"></button>
        <button class="mood-swatch"        data-mood="ocean"  title="Deep Ocean"  style="background:linear-gradient(135deg,#031420,#083040,#1a7090)"></button>
        <button class="mood-swatch"        data-mood="forest" title="Forest"      style="background:linear-gradient(135deg,#061510,#0e2c18,#225830)"></button>
        <button class="mood-swatch"        data-mood="aurora" title="Aurora"      style="background:linear-gradient(135deg,#080530,#061828,#0a3028)"></button>
      </div>
    </div>

    <footer>
      <p>Time shown in your local timezone</p>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
